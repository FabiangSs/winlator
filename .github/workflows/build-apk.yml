- name: Checkout Winlator
  uses: actions/checkout@v4
  with:
    fetch-depth: 0
    submodules: recursive

- name: Repository information
  run: |
    set -e

    echo "======================================"
    echo "WINLATOR"
    echo "======================================"

    git log -1 --oneline

    echo ""
    echo "Submodules:"
    git submodule status --recursive

- name: Verify Vortek
  run: |
    set -e

    SERIALIZER=$(find vortek \
      -type f \
      -name "vortek_serializer.h" \
      -print -quit)

    if [ -z "$SERIALIZER" ]; then
      echo "::error::vortek_serializer.h not found"
      exit 1
    fi

    echo "Found: $SERIALIZER"

- name: Setup Java
  uses: actions/setup-java@v4
  with:
    distribution: temurin
    java-version: '17'
    cache: gradle

- name: Setup Android
  uses: android-actions/setup-android@v3

- name: Install Android toolchain
  run: |
    yes | sdkmanager --licenses || true

    sdkmanager \
      "platform-tools" \
      "platforms;android-35" \
      "build-tools;35.0.0" \
      "ndk;24.0.8215888" \
      "cmake;3.22.1"

- name: Configure NDK
  run: |
    echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/24.0.8215888" >> "$GITHUB_ENV"

- name: Verify environment
  run: |
    java -version

    echo ""
    echo "ANDROID_NDK_HOME:"
    echo "$ANDROID_NDK_HOME"

    echo ""
    echo "CMake:"
    "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake" --version

- name: Build Winlator
  working-directory: app
  run: |
    chmod +x gradlew

    ./gradlew assembleDebug \
      --no-daemon \
      --stacktrace \
      --console=plain \
      --info
