name: Winlator Ultimate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: winlator-build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:

    name: Build Winlator ARM64
    runs-on: ubuntu-24.04

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.jvmargs=-Xmx5g

      JAVA_TOOL_OPTIONS: -Xmx5g

    steps:

      # ============================================================
      # 1. CHECKOUT COMPLETO
      # ============================================================

      - name: Checkout Winlator + submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false


      # ============================================================
      # 2. INFORMACIÓN DEL REPOSITORIO
      # ============================================================

      - name: Show repository state
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "WINLATOR BUILD"
          echo "======================================"

          echo ""
          echo "Root commit:"
          git rev-parse HEAD

          echo ""
          echo "Root short commit:"
          git rev-parse --short HEAD

          echo ""
          echo "Branches:"
          git branch -a || true

          echo ""
          echo "Submodules:"
          git submodule status --recursive

          echo ""
          echo "Repository status:"
          git status --short --branch

          echo ""
          echo "Top-level files:"
          ls -la


      # ============================================================
      # 3. VERIFICAR SUBMÓDULOS
      # ============================================================

      - name: Verify Winlator components
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "WINLATOR COMPONENTS"
          echo "======================================"

          for repo in app vortek gladio; do

            echo ""
            echo "--------------------------------------"
            echo "COMPONENT: $repo"
            echo "--------------------------------------"

            test -d "$repo"

            echo ""
            echo "Commit:"
            git -C "$repo" rev-parse HEAD

            echo ""
            echo "Short commit:"
            git -C "$repo" rev-parse --short HEAD

            echo ""
            echo "Branch:"
            git -C "$repo" branch --show-current || true

            echo ""
            echo "Remote:"
            git -C "$repo" remote -v || true

            echo ""
            echo "Status:"
            git -C "$repo" status --short || true

          done


      # ============================================================
      # 4. NO FORZAR SUBMÓDULOS A MAIN
      # ============================================================
      #
      # IMPORTANTE:
      #
      # No hacemos:
      #
      # git -C app checkout main
      # git -C app reset --hard origin/main
      #
      # ni lo mismo para Vortek/Gladio.
      #
      # El repositorio principal puede apuntar a commits concretos
      # compatibles entre sí.
      #
      # ============================================================


      # ============================================================
      # 5. VERIFICAR VORTEK
      # ============================================================

      - name: Verify Vortek serializer
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "VERIFY VORTEK"
          echo "======================================"

          test -d vortek

          echo ""
          echo "Vortek commit:"
          git -C vortek rev-parse HEAD

          echo ""
          echo "Searching vortek_serializer.h..."

          HEADER="$(find vortek \
            -type f \
            -name "vortek_serializer.h" \
            -print \
            -quit || true)"

          if [ -z "$HEADER" ]; then

            echo ""
            echo "::error::vortek_serializer.h was not found."

            echo ""
            echo "Available Vortek headers:"

            find vortek \
              -type f \
              \
                -name "*.h" \
                -o -name "*.hpp" \
              \
              -print \
              | sort \
              | head -300 || true

            exit 1
          fi

          echo ""
          echo "FOUND:"
          echo "$HEADER"

          echo ""
          echo "Header information:"
          ls -lh "$HEADER"


      # ============================================================
      # 6. INSPECCIONAR INTEGRACIÓN VORTEK
      # ============================================================

      - name: Inspect Vortek integration
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "VORTEK REFERENCES"
          echo "======================================"

          echo ""
          echo "References to vortek_serializer:"

          grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            "vortek_serializer" \
            app \
            vortek \
            gladio \
            2>/dev/null \
            | head -300 || true

          echo ""
          echo "Vortek CMake files:"

          find vortek \
            -type f \
            \
              -name "CMakeLists.txt" \
              -o -name "*.cmake" \
            \
            -print \
            | sort \
            | head -200 || true


      # ============================================================
      # 7. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ============================================================
      # 8. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 9. INSTALAR ANDROID TOOLCHAIN
      # ============================================================

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "ANDROID TOOLCHAIN"
          echo "======================================"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"


      # ============================================================
      # 10. CONFIGURAR NDK
      # ============================================================

      - name: Configure Android environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "ANDROID ENVIRONMENT"
          echo "======================================"

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT:-not-set}"

          NDK_PATH="$ANDROID_HOME/ndk/24.0.8215888"

          echo ""
          echo "NDK:"
          echo "$NDK_PATH"

          test -d "$NDK_PATH"

          {
            echo "ANDROID_NDK_ROOT=$NDK_PATH"
            echo "ANDROID_NDK_HOME=$NDK_PATH"
          } >> "$GITHUB_ENV"

          echo ""
          echo "SDK directory:"
          ls -la "$ANDROID_HOME"

          echo ""
          echo "NDK directory:"
          ls -la "$NDK_PATH"


      # ============================================================
      # 11. VERIFICAR TOOLCHAIN
      # ============================================================

      - name: Verify build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "BUILD ENVIRONMENT"
          echo "======================================"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Java compiler:"
          javac -version

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_NDK_HOME:"
          echo "$ANDROID_NDK_HOME"

          echo ""
          echo "NDK version:"
          "$ANDROID_NDK_HOME/ndk-build" --version || true

          echo ""
          echo "CMake:"
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version

          echo ""
          echo "ADB:"
          adb version

          echo ""
          echo "SDK platforms:"
          ls -la "$ANDROID_HOME/platforms"

          echo ""
          echo "SDK build-tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo ""
          echo "SDK NDK:"
          ls -la "$ANDROID_HOME/ndk"


      # ============================================================
      # 12. PREPARAR GRADLE
      # ============================================================

      - name: Prepare Gradle wrapper
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          test -f ./gradlew

          chmod +x ./gradlew

          ./gradlew --version


      # ============================================================
      # 13. CREAR DIRECTORIO DE DIAGNÓSTICO
      # ============================================================

      - name: Prepare diagnostics directory
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p diagnostics

          echo "Diagnostics directory ready."


      # ============================================================
      # 14. INSPECCIONAR GRADLE
      # ============================================================

      - name: Inspect Gradle project
        working-directory: app
        shell: bash
        run: |
          set -o pipefail

          echo "======================================"
          echo "GRADLE PROJECT"
          echo "======================================"

          ./gradlew tasks \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee ../diagnostics/gradle-tasks.log

          echo ""
          echo "======================================"
          echo "GRADLE BUILD FILES"
          echo "======================================"

          find . \
            -type f \
            \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "gradle.properties" \
            \
            -print \
            | sort \
            | tee ../diagnostics/gradle-build-files.txt


      # ============================================================
      # 15. INSPECCIONAR BUILD NATIVO
      # ============================================================

      - name: Inspect native build configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "NATIVE BUILD FILES"
          echo "======================================"

          find . \
            -type f \
            \
              -name "CMakeLists.txt" \
              -o -name "Android.mk" \
              -o -name "Application.mk" \
              -o -name "*.cmake" \
            \
            -print \
            | sort \
            | tee
