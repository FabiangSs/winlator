name: Winlator Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Winlator
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show repository
        run: |
          echo "Repository:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Submodules:"
          git submodule status

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Update submodules
        run: |
          set -e

          for repo in app vortek gladio; do
            echo "Updating $repo"

            git -C "$repo" fetch origin main
            git -C "$repo" checkout main
            git -C "$repo" reset --hard origin/main
          done

      - name: Check Vortek
        run: |
          echo "Searching vortek_serializer.h"

          find vortek \
            -type f \
            -name "vortek_serializer.h" \
            -print

      - name: Build
        working-directory: app
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Find APK
        if: always()
        run: |
          echo "APK files:"
          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-ARM64
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
