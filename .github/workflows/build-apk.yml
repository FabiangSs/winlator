      - name: Update Winlator components
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "UPDATING WINLATOR COMPONENTS"
          echo "========================================"

          for repo in app vortek gladio; do
            echo ""
            echo ">>> $repo"

            git -C "$repo" fetch --prune origin

            if git -C "$repo" show-ref --verify --quiet refs/remotes/origin/main; then
              git -C "$repo" checkout -B main origin/main
              git -C "$repo" reset --hard origin/main
            else
              echo "::error::$repo does not have origin/main"
              exit 1
            fi

            echo "Commit:"
            git -C "$repo" log -1 --oneline
          done
