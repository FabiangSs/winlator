name: Winlator Ultimate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-winlator:

    name: Build Winlator ARM64
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout Winlator
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # ==========================================================
      # 2. REPOSITORY INFORMATION
      # ==========================================================

      - name: Repository information
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "WINLATOR BUILD"
          echo "======================================"

          echo ""
          echo "Root repository:"
          git remote -v

          echo ""
          echo "Root commit:"
          git log -1 --oneline

          echo ""
          echo "Submodules:"
          git submodule status

          echo ""
          echo "Directory:"
          ls -la

      # ==========================================================
      # 3. VERIFY SUBMODULES
      # ==========================================================

      - name: Verify Winlator components
        shell: bash
        run: |
          set -euo pipefail

          for repo in app vortek gladio; do

            echo ""
            echo "======================================"
            echo "COMPONENT: $repo"
            echo "======================================"

            if [ ! -d "$repo" ]; then
              echo "::error::$repo directory does not exist"
              exit 1
            fi

            echo ""
            echo "Remote:"
            git -C "$repo" remote -v || true

            echo ""
            echo "HEAD:"
            git -C "$repo" log -1 --oneline || true

            echo ""
            echo "Branch:"
            git -C "$repo" branch --show-current || true

            echo ""
            echo "Status:"
            git -C "$repo" status --short || true

          done

      # ==========================================================
      # 4. DO NOT FORCE SUBMODULES TO MAIN
      # ==========================================================
      #
      # IMPORTANTE:
      # No hacemos:
      #
      # git checkout main
      # git reset --hard origin/main
      #
      # porque el repositorio Winlator puede depender de commits
      # específicos de app/vortek/gladio.
      #
      # ==========================================================

      - name: Verify Vortek serializer
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VORTEK SERIALIZER"
          echo "======================================"

          SERIALIZER=$(find vortek \
            -type f \
            -name "vortek_serializer.h" \
            -print -quit)

          if [ -z "$SERIALIZER" ]; then
            echo "::error::vortek_serializer.h not found"
            echo ""
            echo "Available Vortek headers:"
            find vortek \
              -type f \
              \( -name "*.h" -o -name "*.hpp" \) \
              | head -200 || true
            exit 1
          fi

          echo "Found:"
          echo "$SERIALIZER"

          echo ""
          echo "Serializer location:"
          dirname "$SERIALIZER"

      # ==========================================================
      # 5. SEARCH VORTEK REFERENCES
      # ==========================================================

      - name: Inspect Vortek integration
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VORTEK REFERENCES"
          echo "======================================"

          echo ""
          echo "References to vortek_serializer:"
          grep -RIn \
            --exclude-dir=.git \
            "vortek_serializer" \
            app \
            vortek \
            gladio \
            2>/dev/null \
            | head -200 || true

          echo ""
          echo "Vortek CMake files:"
          find vortek \
            -type f \
            \( -name "CMakeLists.txt" -o -name "*.cmake" \) \
            -print \
            | head -100 || true

      # ==========================================================
      # 6. JAVA 17
      # ==========================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================================
      # 7. ANDROID SDK
      # ==========================================================

      - name: Setup Android
        uses: android-actions/setup-android@v3

      # ==========================================================
      # 8. ANDROID TOOLCHAIN
      # ==========================================================

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      # ==========================================================
      # 9. CONFIGURE NDK
      # ==========================================================

      - name: Configure NDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/24.0.8215888" \
            >> "$GITHUB_ENV"

          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/24.0.8215888" \
            >> "$GITHUB_ENV"

      # ==========================================================
      # 10. VERIFY TOOLCHAIN
      # ==========================================================

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILD ENVIRONMENT"
          echo "======================================"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          cd app
          ./gradlew --version
          cd ..

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "ANDROID_NDK_HOME:"
          echo "$ANDROID_NDK_HOME"

          echo ""
          echo "NDK:"
          "$ANDROID_NDK_HOME/ndk-build" --version || true

          echo ""
          echo "CMake:"
          "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake" --version

          echo ""
          echo "ADB:"
          adb version

      # ==========================================================
      # 11. GRADLE PROJECT INSPECTION
      # ==========================================================

      - name: Inspect Gradle project
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ../diagnostics

          echo "======================================"
          echo "GRADLE TASKS"
          echo "======================================"

          ./gradlew tasks \
            --no-daemon \
            --console=plain \
            --stacktrace \
            2>&1 | tee ../diagnostics/gradle-tasks.log

          echo ""
          echo "======================================"
          echo "PROJECT STRUCTURE"
          echo "======================================"

          find . \
            -maxdepth 3 \
            -type f \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "CMakeLists.txt" \
              -o -name "gradle.properties" \
            \) \
            -print \
            | sort \
            | tee ../diagnostics/build-files.txt

      # ==========================================================
      # 12. CLEAN
      # ==========================================================

      - name: Clean Winlator
        working-directory: app
        shell: bash
        run: |
          set -o pipefail

          mkdir -p ../diagnostics

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee ../diagnostics/gradle-clean.log

      # ==========================================================
      # 13. BUILD WINLATOR
      # ==========================================================

      - name: Build Winlator
        working-directory: app
        shell: bash
        run: |
          set -o pipefail

          mkdir -p ../diagnostics

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --info \
            2>&1 | tee ../diagnostics/gradle-build.log

      # ==========================================================
      # 14. LOCATE APK
      # ==========================================================

      - name: Locate Winlator APK
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "WINLATOR APK"
          echo "======================================"

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null || true

      # ==========================================================
      # 15. PREPARE APK
      # ==========================================================

      - name: Prepare Winlator APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          APK=$(find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::Winlator APK was not generated"
            exit 1
          fi

          cp "$APK" \
            dist/Winlator-Ultimate-ARM64.apk

          echo ""
          echo "APK:"
          ls -lh dist/Winlator-Ultimate-ARM64.apk

          echo ""
          echo "SHA256:"
          sha256sum dist/Winlator-Ultimate-ARM64.apk

      # ==========================================================
      # 16. APK ARTIFACT
      # ==========================================================

      - name: Upload Winlator APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Ultimate-ARM64
          path: dist/Winlator-Ultimate-ARM64.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 17. COMPLETE DIAGNOSTICS
      # ==========================================================

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p diagnostics

          echo "======================================"
          echo "COLLECTING DIAGNOSTICS"
          echo "======================================"

          echo ""
          echo "Root commit:"
          git rev-parse HEAD \
            > diagnostics/root-commit.txt

          echo ""
          echo "Submodule status:"
          git submodule status \
            > diagnostics/submodule-status.txt

          echo ""
          echo "App commit:"
          git -C app rev-parse HEAD \
            > diagnostics/app-commit.txt

          echo ""
          echo "Vortek commit:"
          git -C vortek rev-parse HEAD \
            > diagnostics/vortek-commit.txt

          echo ""
          echo "Gladio commit:"
          git -C gladio rev-parse HEAD \
            > diagnostics/gladio-commit.txt

          echo ""
          echo "Submodule remotes:"
          {
            echo "APP"
            git -C app remote -v

            echo ""
            echo "VORTEK"
            git -C vortek remote -v

            echo ""
            echo "GLADIO"
            git -C gladio remote -v
          } > diagnostics/submodule-remotes.txt

          echo ""
          echo "Environment:"
          {
            env | sort
          } > diagnostics/environment.txt

          echo ""
          echo "Gradle files:"
          find app \
            -type f \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "CMakeLists.txt" \
            \) \
            -print \
            | sort \
            > diagnostics/gradle-cmake-files.txt

          echo ""
          echo "APK outputs:"
          find app/build/outputs \
            -type f \
            -print \
            > diagnostics/apk-outputs.txt \
            2>/dev/null || true

          echo ""
          echo "Build reports:"
          find app/build \
            -type f \
            \( \
              -name "*.log" \
              -o -name "*.txt" \
              -o -name "*.html" \
              -o -name "*.xml" \
            \) \
            -print \
            | sort \
            | head -1000 \
            > diagnostics/build-reports.txt \
            2>/dev/null || true

      # ==========================================================
      # 18. UPLOAD DIAGNOSTICS
      # ==========================================================

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-build-diagnostics
          path: |
            diagnostics/**
            app/build/outputs/**
            app/build/intermediates/**
            app/build/reports/**
          if-no-files-found: warn
          retention-days: 14

      # ==========================================================
      # 19. SUMMARY
      # ==========================================================

      - name: Winlator build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Winlator Ultimate"
            echo ""

            echo "## Root"
            echo "\`$(git rev-parse --short HEAD)\`"
            echo ""

            echo "## Components"
            echo ""
            echo "| Component | Commit |"
            echo "|---|---|"
            echo "| App | \`$(git -C app rev-parse --short HEAD)\` |"
            echo "| Vortek | \`$(git -C vortek rev-parse --short HEAD)\` |"
            echo "| Gladio | \`$(git -C gladio rev-parse --short HEAD)\` |"
            echo ""

            echo "## Toolchain"
            echo "- Ubuntu 24.04"
            echo "- Android 35"
            echo "- Java 17"
            echo "- NDK 24.0.8215888"
            echo "- CMake 3.22.1"
            echo "- ARM64"
            echo ""

            echo "## APK"
            find app/build/outputs \
              -type f \
              -name "*.apk" \
              -print \
              2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
