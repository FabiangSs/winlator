name: Winlator Ultimate Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winlator-build
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"
  NDK_VERSION: "24.0.8215888"
  CMAKE_VERSION: "3.22.1"

jobs:

  build:
    name: Build Winlator ARM64
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT PRINCIPAL + SUBMODULES
      # ============================================================

      - name: Checkout Winlator
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # ============================================================
      # 2. ACTUALIZAR COMPONENTES
      #
      # Winlator está compuesto por:
      #   app
      #   vortek
      #   gladio
      #
      # Se llevan a sus respectivos main.
      # ============================================================

      - name: Update Winlator components
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "UPDATING WINLATOR COMPONENTS"
          echo "========================================"

          for repo in app vortek gladio; do

            echo ""
            echo ">>> Updating $repo"

            git -C "$repo" fetch --prune origin main
            git -C "$repo" checkout -B main origin/main
            git -C "$repo" reset --hard origin/main

            echo ""
            echo "$repo commit:"
            git -C "$repo" log -1 \
              --format="%H%n%ad%n%s" \
              --date=iso

          done

      # ============================================================
      # 3. MOSTRAR COMMITS
      # ============================================================

      - name: Show source revisions
        shell: bash
        run: |
          echo "========================================"
          echo "SOURCE REVISIONS"
          echo "========================================"

          echo ""
          echo "Winlator:"
          git log -1 --oneline

          echo ""
          echo "App:"
          git -C app log -1 --oneline

          echo ""
          echo "Vortek:"
          git -C vortek log -1 --oneline

          echo ""
          echo "Gladio:"
          git -C gladio log -1 --oneline

      # ============================================================
      # 4. VERIFICAR VORTEK
      # ============================================================

      - name: Verify Vortek
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VORTEK VERIFICATION"
          echo "========================================"

          echo ""
          echo "Looking for vortek_serializer.h..."

          SERIALIZER=$(find vortek \
            -type f \
            -name "vortek_serializer.h" \
            -print -quit)

          if [ -z "$SERIALIZER" ]; then
            echo "::error::vortek_serializer.h was not found!"
            echo ""
            echo "Vortek tree:"
            find vortek -maxdepth 3 -type f | sort | head -300
            exit 1
          fi

          echo "FOUND:"
          echo "$SERIALIZER"

          echo ""
          echo "Looking for vortek.h..."

          find vortek \
            -type f \
            -name "vortek.h" \
            -print

      # ============================================================
      # 5. CONFIGURAR JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ============================================================
      # 6. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 7. INSTALAR SDK / NDK / CMAKE
      # ============================================================

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      # ============================================================
      # 8. CONFIGURAR NDK
      # ============================================================

      - name: Configure NDK
        shell: bash
        run: |

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" \
            >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" \
            >> "$GITHUB_ENV"

      # ============================================================
      # 9. MOSTRAR TOOLCHAIN
      # ============================================================

      - name: Show build environment
        shell: bash
        run: |

          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "NDK:"
          echo "$ANDROID_NDK_HOME"

          echo ""
          echo "CMake:"
          "$ANDROID_SDK_ROOT/cmake/${CMAKE_VERSION}/bin/cmake" \
            --version

          echo ""
          echo "SDK packages:"
          sdkmanager --list_installed | head -100

      # ============================================================
      # 10. GRADLE
      # ============================================================

      - name: Prepare Gradle
        working-directory: app
        shell: bash
        run: |
          chmod +x gradlew

          echo "Gradle wrapper:"
          grep distributionUrl \
            gradle/wrapper/gradle-wrapper.properties || true

          ./gradlew --version

      # ============================================================
      # 11. LIMPIAR
      # ============================================================

      - name: Clean
        working-directory: app
        shell: bash
        run: |
          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ============================================================
      # 12. BUILD
      #
      # assembleDebug mantiene el comportamiento original
      # del proyecto y evita introducir una variante inexistente.
      # ============================================================

      - name: Build Winlator
        working-directory: app
        shell: bash
        run: |
          set -o pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain

      # ============================================================
      # 13. DIAGNÓSTICO SIEMPRE
      # ============================================================

      - name: Build diagnostics
        if: always()
        shell: bash
        run: |

          echo "========================================"
          echo "APK OUTPUTS"
          echo "========================================"

          find app/build/outputs \
            -type f \
            -print 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "NATIVE LIBRARIES"
          echo "========================================"

          find app/build/intermediates \
            -type f \
            \( \
              -name "*.so" \
              -o -name "*.aar" \
            \) \
            -print 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "VORTEK SERIALIZER"
          echo "========================================"

          find vortek \
            -type f \
            -name "vortek_serializer.h" \
            -print 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "GRADLE REPORTS"
          echo "========================================"

          find app/build \
            -type f \
            \( \
              -name "*.log" \
              -o -name "*.txt" \
              \) \
            -print 2>/dev/null | head -200 || true

      # ============================================================
      # 14. BUSCAR APK
      # ============================================================

      - name: Locate APK
        shell: bash
        run: |

          set -euo pipefail

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::No APK was generated!"
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ============================================================
      # 15. INFORMACIÓN DEL APK
      # ============================================================

      - name: Inspect APK
        if: success()
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p dist

          cp "$APK_PATH" \
            "dist/Winlator-Ultimate-ARM64.apk"

          echo "APK size:"
          du -h "dist/Winlator-Ultimate-ARM64.apk"

          echo ""
          echo "SHA256:"
          sha256sum \
            "dist/Winlator-Ultimate-ARM64.apk"

      # ============================================================
      # 16. SUBIR APK
      # ============================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Ultimate-ARM64
          path: dist/Winlator-Ultimate-ARM64.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 17. SUBIR DIAGNÓSTICOS SI FALLA
      # ============================================================

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Build-Diagnostics
          path: |
            app/build/outputs/**
            app/build/intermediates/**
            app/build/reports/**
            app/build/compose_metrics/**
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 18. GITHUB SUMMARY
      # ============================================================

      - name: Build summary
        if: always()
        shell: bash
        run: |

          {
            echo "# 🚀 Winlator Ultimate Build"
            echo ""
            echo "## Components"
            echo ""
            echo "| Component | Commit |"
            echo "|---|---|"
            echo "| Winlator | \`$(git rev-parse --short HEAD)\` |"
            echo "| App | \`$(git -C app rev-parse --short HEAD)\` |"
            echo "| Vortek | \`$(git -C vortek rev-parse --short HEAD)\` |"
            echo "| Gladio | \`$(git -C gladio rev-parse --short HEAD)\` |"
            echo ""
            echo "## Toolchain"
            echo ""
            echo "- Java: ${JAVA_VERSION}"
            echo "- Android API: ${ANDROID_API}"
            echo "- Build Tools: ${BUILD_TOOLS}"
            echo "- NDK: ${NDK_VERSION}"
            echo "- CMake: ${CMAKE_VERSION}"
            echo "- ABI: ARM64"
            echo ""
            echo "## Build status"
            echo ""
            echo "Workflow: ${GITHUB_WORKFLOW}"
            echo "Run: ${GITHUB_RUN_NUMBER}"
            echo "Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
