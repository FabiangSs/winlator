name: Winlator Ultimate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: winlator-build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:

    name: Build Winlator ARM64
    runs-on: ubuntu-24.04

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.jvmargs=-Xmx5g

      JAVA_TOOL_OPTIONS: -Xmx5g

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Winlator
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false


      # ============================================================
      # 2. SHOW REPOSITORY STATE
      # ============================================================

      - name: Show repository state
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "WINLATOR"
          echo "======================================"

          echo ""
          echo "Root commit:"
          git rev-parse HEAD

          echo ""
          echo "Submodules:"
          git submodule status --recursive

          echo ""
          echo "Repository status:"
          git status --short --branch


      # ============================================================
      # 3. FIX SUBMODULES
      # ============================================================

      - name: Initialize and update submodules
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "FIXING SUBMODULES"
          echo "======================================"

          git submodule update --init --recursive --force
          git submodule sync --recursive
          git submodule foreach --recursive 'git fetch origin && git checkout origin/main || git checkout origin/master || true'

          echo ""
          echo "Updated submodule status:"
          git submodule status --recursive


      # ============================================================
      # 4. VERIFY COMPONENTS
      # ============================================================

      - name: Verify Winlator components
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "COMPONENTS"
          echo "======================================"

          for repo in app vortek gladio; do

            echo ""
            echo "--------------------------------------"
            echo "$repo"
            echo "--------------------------------------"

            test -d "$repo"

            echo "Commit:"
            git -C "$repo" rev-parse HEAD

            echo "Remote:"
            git -C "$repo" remote -v || true

            echo "Status:"
            git -C "$repo" status --short || true

          done


      # ============================================================
      # 5. VERIFY VORTEK SERIALIZER
      # ============================================================

      - name: Verify Vortek serializer
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VORTEK SERIALIZER"
          echo "======================================"

          HEADER="$(find vortek -type f -name 'vortek_serializer.h' -print -quit 2>/dev/null || echo '')"

          if [ -z "$HEADER" ]; then
            echo "::error::vortek_serializer.h was not found"

            echo ""
            echo "Vortek directory structure:"
            find vortek -type f -name '*.h' -o -name '*.hpp' 2>/dev/null | head -50 || echo "No headers found"

            echo ""
            echo "All vortek files:"
            find vortek -type f 2>/dev/null | head -100 || echo "No files found"

            exit 1
          fi

          echo "FOUND:"
          echo "$HEADER"

          echo ""
          echo "Header info:"
          ls -lh "$HEADER"


      # ============================================================
      # 6. INSPECT VORTEK REFERENCES
      # ============================================================

      - name: Inspect Vortek integration
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          echo "======================================"
          echo "VORTEK REFERENCES"
          echo "======================================"

          grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            'vortek_serializer' \
            app \
            vortek \
            gladio \
            2>/dev/null \
            | head -300 \
            | tee diagnostics/vortek-references.txt || true

          echo ""
          echo "Vortek CMake files:"

          find vortek \
            -type f \
            \( \
              -name 'CMakeLists.txt' \
              -o -name '*.cmake' \
            \) \
            -print \
            | sort \
            | tee diagnostics/vortek-cmake-files.txt || true


      # ============================================================
      # 7. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ============================================================
      # 8. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 9. INSTALL ANDROID COMPONENTS
      # ============================================================

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "ANDROID TOOLCHAIN"
          echo "======================================"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"


      # ============================================================
      # 10. CONFIGURE NDK
      # ============================================================

      - name: Configure Android environment
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "ANDROID ENVIRONMENT"
          echo "======================================"

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT:-not-set}"

          NDK_PATH="$ANDROID_HOME/ndk/24.0.8215888"

          test -d "$NDK_PATH"

          echo ""
          echo "NDK:"
          echo "$NDK_PATH"

          {
            echo "ANDROID_NDK_ROOT=$NDK_PATH"
            echo "ANDROID_NDK_HOME=$NDK_PATH"
          } >> "$GITHUB_ENV"


      # ============================================================
      # 11. VERIFY TOOLCHAIN
      # ============================================================

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILD ENVIRONMENT"
          echo "======================================"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Javac:"
          javac -version

          echo ""
          echo "Gradle:"
          cd app
          chmod +x gradlew
          ./gradlew --version
          cd ..

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "NDK:"
          echo "$ANDROID_NDK_HOME"

          echo ""
          echo "CMake:"
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version


      # ============================================================
      # 12. GRADLE TASKS
      # ============================================================

      - name: Verify Gradle project
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ../diagnostics

          ./gradlew tasks \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee ../diagnostics/gradle-tasks.log


      # ============================================================
      # 13. INSPECT BUILD FILES
      # ============================================================

      - name: Inspect native build configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "NATIVE BUILD FILES"
          echo "======================================"

          find . \
            -type f \
            \( \
              -name 'CMakeLists.txt' \
              -o -name 'Android.mk' \
              -o -name 'Application.mk' \
              -o -name '*.cmake' \
            \) \
            -print \
            | sort \
            | tee diagnostics/native-build-files.txt


      # ============================================================
      # 13.5. PATCH DUPLICATED HEADERS
      # ============================================================

      - name: Remove duplicated headers
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "PATCHING WORKSPACE"
          echo "======================================"

          if [ -f "app/app/src/main/cpp/vortekrenderer/include/vortek_serializer.h" ]; then
            echo "Eliminando archivo duplicado en app..."
            rm -f app/app/src/main/cpp/vortekrenderer/include/vortek_serializer.h
            echo "Archivo removido con éxito."
          else
            echo "No se encontró cabecera duplicada en app. Todo limpio."
          fi


      # ============================================================
      # 14. CLEAN
      # ============================================================

      - name: Clean Gradle
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee ../diagnostics/gradle-clean.log


      # ============================================================
      # 15. BUILD WINLATOR
      # ============================================================

      - name: Build Winlator ARM64
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILD WINLATOR"
          echo "======================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --info \
            2>&1 | tee ../diagnostics/gradle-build.log


      # ============================================================
      # 16. LOCATE APK
      # ============================================================

      - name: Locate APK
        if: always()
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "GENERATED APK"
          echo "======================================"

          find app/build \
            -type f \
            -name '*.apk' \
            -print \
            -exec ls -lh {} \;

          echo ""
          echo "APK count:"

          find app/build \
            -type f \
            -name '*.apk' \
            | wc -l


      # ============================================================
      # 17. PREPARE APK
      # ============================================================

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          APK="$(find app/build -type f -name '*.apk' -print | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          echo "Found APK at: $APK"
          cp "$APK" dist/Winlator-Ultimate-ARM64.apk

          echo ""
          echo "APK:"
          ls -lh dist/Winlator-Ultimate-ARM64.apk

          echo ""
          echo "SHA256:"
          sha256sum dist/Winlator-Ultimate-ARM64.apk


      # ============================================================
      # 18. UPLOAD APK
      # ============================================================

      - name: Upload Winlator APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Ultimate-ARM64
          path: dist/Winlator-Ultimate-ARM64.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 19. COLLECT DIAGNOSTICS
      # ============================================================

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p diagnostics

          echo "Collecting diagnostics..."

          git rev-parse HEAD \
            > diagnostics/root-commit.txt

          git submodule status --recursive \
            > diagnostics/submodule-status.txt

          git -C app rev-parse HEAD \
            > diagnostics/app-commit.txt

          git -C vortek rev-parse HEAD \
            > diagnostics/vortek-commit.txt

          git -C gladio rev-parse HEAD \
            > diagnostics/gladio-commit.txt

          {
            echo "APP"
            git -C app remote -v

            echo ""
            echo "VORTEK"
            git -C vortek remote -v

            echo ""
            echo "GLADIO"
            git -C gladio remote -v
          } > diagnostics/submodule-remotes.txt

          {
            echo "ROOT"
            git status --short --branch

            echo ""
            echo "APP"
            git -C app status --short --branch

            echo ""
            echo "VORTEK"
            git -C vortek status --short --branch

            echo ""
            echo "GLADIO"
            git -C gladio status --short --branch
          } > diagnostics/git-status.txt

          find vortek \
            -type f \
            -name 'vortek_serializer.h' \
            -print \
            > diagnostics/vortek-header.txt 2>&1

          find . \
            -type f \
            \( \
              -name '*.log' \
              -o -name '*.html' \
              -o -name '*.xml' \
            \) \
            -not -path '*/.git/*' \
            -not -path '*/node_modules/*' \
            -not -path '*/build/intermediates/*' \
            -print \
            | sort \
            > diagnostics/build-reports.txt

          find app/build \
            -type f \
            -name '*.apk' \
            > diagnostics/build-outputs.txt 2>/dev/null || true

          env | sort \
            > diagnostics/environment.txt

          echo "Diagnostics complete."


      # ============================================================
      # 20. UPLOAD DIAGNOSTICS
      # ============================================================

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-build-diagnostics
          path: |
            diagnostics/**
            app/build/outputs/**
            app/build/reports/**
          if-no-files-found: warn
          retention-days: 14


      # ============================================================
      # 21. SUMMARY
      # ============================================================

      - name: Winlator build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Winlator Ultimate"
            echo ""

            echo "## Commits"
            echo ""
            echo "| Component | Commit |"
            echo "|---|---|"
            echo "| Root | \`$(git rev-parse --short HEAD)\` |"
            echo "| App | \`$(git -C app rev-parse --short HEAD)\` |"
            echo "| Vortek | \`$(git -C vortek rev-parse --short HEAD)\` |"
            echo "| Gladio | \`$(git -C gladio rev-parse --short HEAD)\` |"

            echo ""
            echo "## Toolchain"
            echo ""
            echo "- Ubuntu 24.04"
            echo "- Android API 35"
            echo "- Build Tools 35.0.0"
            echo "- Java 17"
            echo "- NDK 24.0.8215888"
            echo "- CMake 3.22.1"
            echo "- ARM64"

            echo ""
            echo "## Vortek Serializer"
            echo ""

            if find vortek \
              -type f \
              -name 'vortek_serializer.h' \
              -print \
              | grep -q .; then
              echo "FOUND"
            else
              echo "NOT FOUND"
            fi

            echo ""
            echo "## APK"
            echo ""

            find app/build \
              -type f \
              -name '*.apk' \
              -print \
              2>/dev/null || true

          } >> "$GITHUB_STEP_SUMMARY"
