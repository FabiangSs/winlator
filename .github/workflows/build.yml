name: Winlator Ultimate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: winlator-build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:

    name: Build Winlator ARM64
    runs-on: ubuntu-24.04

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.jvmargs=-Xmx5g

      JAVA_TOOL_OPTIONS: -Xmx5g

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Winlator
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false


      # ============================================================
      # 2. SHOW REPOSITORY STATE
      # ============================================================

      - name: Show repository state
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "WINLATOR"
          echo "======================================"

          echo ""
          echo "Root commit:"
          git rev-parse HEAD

          echo ""
          echo "Repository status:"
          git status --short --branch


      # ============================================================
      # 3. CLONE & SETUP C++ COMPONENTS (GLADIO & VORTEK)
      # ============================================================

      - name: Clone C++ Dependencies directly into app
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "CLONING NATIVE DEPENDENCIES"
          echo "======================================"

          TARGET_CPP_DIR="app/app/src/main/cpp"

          # Limpiar carpetas objetivo para prevenir conflictos de archivos faltantes
          rm -rf "$TARGET_CPP_DIR/gladio"
          rm -rf "$TARGET_CPP_DIR/vortekrenderer"

          echo "Clonando Gladio..."
          git clone https://github.com/brunodev85/gladio.git "$TARGET_CPP_DIR/gladio"

          echo "Clonando Vortek..."
          git clone https://github.com/brunodev85/vortek.git "$TARGET_CPP_DIR/vortekrenderer"

          # Si requieres tener copias también en la raíz para logs/diagnósticos
          rm -rf vortek gladio
          cp -r "$TARGET_CPP_DIR/vortekrenderer" vortek
          cp -r "$TARGET_CPP_DIR/gladio" gladio


      # ============================================================
      # 3.1. PATCH VORTEK CMAKE INCLUDE PATHS AND PLATFORM FLAGS
      # ============================================================

      - name: Patch Vortek CMake Include Paths & Platform Flags
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "FIXING VORTEK INCLUDE PATHS & FLAGS"
          echo "======================================"

          VORTEK_DIR="app/app/src/main/cpp/vortekrenderer"

          # 1. Cambiar plataforma XLIB por ANDROID
          find "$VORTEK_DIR" -type f \( -name "CMakeLists.txt" -o -name "*.cmake" \) -exec sed -i 's/VK_USE_PLATFORM_XLIB_KHR/VK_USE_PLATFORM_ANDROID_KHR/g' {} + || true

          # 2. Agregar carpetas de cabeceras legítimas sin incluir basura de .git
          CMAKELISTS="$VORTEK_DIR/CMakeLists.txt"

          if [ -f "$CMAKELISTS" ]; then
            echo "Inyectando rutas de include en $CMAKELISTS..."
            
            # Forzar la inclusión explícita de subcarpetas comunes de headers
            echo 'include_directories(${CMAKE_CURRENT_SOURCE_DIR}/include)' > /tmp/vortek_includes.txt
            echo 'include_directories(${CMAKE_CURRENT_SOURCE_DIR}/include/vortek)' >> /tmp/vortek_includes.txt
            echo 'include_directories(${CMAKE_CURRENT_SOURCE_DIR}/src)' >> /tmp/vortek_includes.txt
            echo 'include_directories(${CMAKE_CURRENT_SOURCE_DIR}/src/vortek)' >> /tmp/vortek_includes.txt

            # Insertar las rutas al inicio del CMakeLists.txt del módulo
            cat /tmp/vortek_includes.txt "$CMAKELISTS" > "$CMAKELISTS.tmp" && mv "$CMAKELISTS.tmp" "$CMAKELISTS"
            echo "Rutas de cabeceras inyectadas correctamente."
          else
            echo "::warning::No se encontro CMakeLists.txt directo en vortekrenderer para parchear includes."
          fi


      # ============================================================
      # 4. VERIFY COMPONENTS
      # ============================================================

      - name: Verify Winlator components
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "COMPONENTS"
          echo "======================================"

          for repo in app/app/src/main/cpp/vortekrenderer app/app/src/main/cpp/gladio; do

            echo ""
            echo "--------------------------------------"
            echo "$repo"
            echo "--------------------------------------"

            test -d "$repo"

            echo "Commit:"
            git -C "$repo" rev-parse HEAD

            echo "Remote:"
            git -C "$repo" remote -v || true

          done


      # ============================================================
      # 5. VERIFY VORTEK SERIALIZER
      # ============================================================

      - name: Verify Vortek serializer
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VORTEK SERIALIZER"
          echo "======================================"

          HEADER="$(find app/app/src/main/cpp/vortekrenderer -type f -name 'vortek_serializer.h' -print -quit 2>/dev/null || echo '')"

          if [ -z "$HEADER" ]; then
            echo "::error::vortek_serializer.h was not found in native path"

            echo ""
            echo "Vortek directory structure:"
            find app/app/src/main/cpp/vortekrenderer -type f -name '*.h' -o -name '*.hpp' 2>/dev/null | head -50 || echo "No headers found"

            exit 1
          fi

          echo "FOUND AT NATIVE PATH:"
          echo "$HEADER"

          echo ""
          echo "Header info:"
          ls -lh "$HEADER"


      # ============================================================
      # 6. INSPECT VORTEK REFERENCES
      # ============================================================

      - name: Inspect Vortek integration
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          echo "======================================"
          echo "VORTEK REFERENCES"
          echo "======================================"

          grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            'vortek_serializer' \
            app \
            2>/dev/null \
            | head -300 \
            | tee diagnostics/vortek-references.txt || true

          echo ""
          echo "Vortek CMake files:"

          find app/app/src/main/cpp/vortekrenderer \
            -type f \
            \( \
              -name 'CMakeLists.txt' \
              -o -name '*.cmake' \
            \) \
            -print \
            | sort \
            | tee diagnostics/vortek-cmake-files.txt || true


      # ============================================================
      # 7. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ============================================================
      # 8. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 9. INSTALL ANDROID COMPONENTS
      # ============================================================

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "ANDROID TOOLCHAIN"
          echo "======================================"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"


      # ============================================================
      # 10. CONFIGURE NDK
      # ============================================================

      - name: Configure Android environment
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "ANDROID ENVIRONMENT"
          echo "======================================"

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          NDK_PATH="$ANDROID_HOME/ndk/24.0.8215888"

          test -d "$NDK_PATH"

          echo ""
          echo "NDK:"
          echo "$NDK_PATH"

          {
            echo "ANDROID_NDK_ROOT=$NDK_PATH"
            echo "ANDROID_NDK_HOME=$NDK_PATH"
          } >> "$GITHUB_ENV"


      # ============================================================
      # 11. VERIFY TOOLCHAIN
      # ============================================================

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILD ENVIRONMENT"
          echo "======================================"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          cd app
          chmod +x gradlew
          ./gradlew --version
          cd ..

          echo ""
          echo "CMake:"
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version


      # ============================================================
      # 12. GRADLE TASKS
      # ============================================================

      - name: Verify Gradle project
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ../diagnostics

          ./gradlew tasks \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee ../diagnostics/gradle-tasks.log


      # ============================================================
      # 13. INSPECT BUILD FILES
      # ============================================================

      - name: Inspect native build configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "NATIVE BUILD FILES"
          echo "======================================"

          find . \
            -type f \
            \( \
              -name 'CMakeLists.txt' \
              -o -name 'Android.mk' \
              -o -name 'Application.mk' \
              -o -name '*.cmake' \
            \) \
            -print \
            | sort \
            | tee diagnostics/native-build-files.txt


      # ============================================================
      # 14. CLEAN
      # ============================================================

      - name: Clean Gradle
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee ../diagnostics/gradle-clean.log


      # ============================================================
      # 15. BUILD WINLATOR
      # ============================================================

      - name: Build Winlator ARM64
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILD WINLATOR"
          echo "======================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --info \
            2>&1 | tee ../diagnostics/gradle-build.log


      # ============================================================
      # 16. LOCATE APK
      # ============================================================

      - name: Locate APK
        if: always()
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "GENERATED APK"
          echo "======================================"

          find app/build \
            -type f \
            -name '*.apk' \
            -print \
            -exec ls -lh {} \;


      # ============================================================
      # 17. PREPARE APK
      # ============================================================

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          APK="$(find app/build -type f -name '*.apk' -print | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          echo "Found APK at: $APK"
          cp "$APK" dist/Winlator-Ultimate-ARM64.apk

          echo ""
          echo "SHA256:"
          sha256sum dist/Winlator-Ultimate-ARM64.apk


      # ============================================================
      # 18. UPLOAD APK
      # ============================================================

      - name: Upload Winlator APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Ultimate-ARM64
          path: dist/Winlator-Ultimate-ARM64.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 19. COLLECT DIAGNOSTICS
      # ============================================================

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p diagnostics

          echo "Collecting diagnostics..."

          git rev-parse HEAD > diagnostics/root-commit.txt
          git -C app/app/src/main/cpp/vortekrenderer rev-parse HEAD > diagnostics/vortek-commit.txt || true
          git -C app/app/src/main/cpp/gladio rev-parse HEAD > diagnostics/gladio-commit.txt || true

          find app/app/src/main/cpp/vortekrenderer \
            -type f \
            -name 'vortek_serializer.h' \
            -print \
            > diagnostics/vortek-header.txt 2>&1

          echo "Diagnostics complete."


      # ============================================================
      # 20. UPLOAD DIAGNOSTICS
      # ============================================================

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-build-diagnostics
          path: |
            diagnostics/**
            app/build/outputs/**
            app/build/reports/**
          if-no-files-found: warn
          retention-days: 14


      # ============================================================
      # 21. SUMMARY
      # ============================================================

      - name: Winlator build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Winlator Ultimate"
            echo ""

            echo "## Toolchain"
            echo "- Ubuntu 24.04"
            echo "- Android API 35"
            echo "- Java 17"
            echo "- NDK 24.0.8215888"
            echo "- CMake 3.22.1"
            echo ""
            echo "## Vortek Serializer Status"

            if find app/app/src/main/cpp/vortekrenderer -type f -name 'vortek_serializer.h' | grep -q .; then
              echo "FOUND"
            else
              echo "NOT FOUND"
            fi

          } >> "$GITHUB_STEP_SUMMARY"
