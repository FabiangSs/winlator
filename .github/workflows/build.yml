name: Winlator Ultimate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: winlator-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Winlator ARM64
    runs-on: ubuntu-24.04

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.jvmargs=-Xmx5g
      JAVA_TOOL_OPTIONS: -Xmx5g

    steps:
      # 1. Checkout
      - name: Checkout Winlator
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      # 2. Setup Dependencies
      - name: Clone C++ Dependencies directly into app
        shell: bash
        run: |
          set -euo pipefail
          TARGET_CPP_DIR="app/app/src/main/cpp"
          rm -rf "$TARGET_CPP_DIR/gladio"
          rm -rf "$TARGET_CPP_DIR/vortekrenderer"
          echo "Clonando componentes..."
          git clone https://github.com/brunodev85/gladio.git "$TARGET_CPP_DIR/gladio"
          git clone https://github.com/brunodev85/vortek.git "$TARGET_CPP_DIR/vortekrenderer"

      # 3. Patching and Fixing
      - name: Patch Vortek CMake & Fix Headers
        shell: bash
        run: |
          set -euo pipefail
          VORTEK_DIR="app/app/src/main/cpp/vortekrenderer"

          # Corregir flag no reconocido
          find app/app/src/main/cpp/ -name "CMakeLists.txt" -exec sed -i 's/-Wno-discarded-qualifiers/-Wno-ignored-qualifiers/g' {} + || true

          # Inyectar headers faltantes en string_utils.h
          STRING_UTILS="app/app/src/main/cpp/winlator/include/string_utils.h"
          if [ -f "$STRING_UTILS" ]; then
            sed -i '1i #include <string.h>\n#include <stdlib.h>' "$STRING_UTILS" || true
          fi

          # Generar CMakeLists.txt corregido
          cat << 'EOF' > "$VORTEK_DIR/CMakeLists.txt"
          cmake_minimum_required(VERSION 3.22.1)
          project(vulkan_vortek C)

          file(GLOB VORTEK_SOURCES "${CMAKE_CURRENT_SOURCE_DIR}/src/*.c")

          add_library(vulkan_vortek SHARED ${VORTEK_SOURCES})

          # Corrección: ruta relativa para incluir resource_memory.h de Winlator
          target_include_directories(vulkan_vortek PRIVATE
              ${CMAKE_CURRENT_SOURCE_DIR}/include
              ${CMAKE_CURRENT_SOURCE_DIR}/src
              ${CMAKE_CURRENT_SOURCE_DIR}/../winlator/include
          )

          target_compile_definitions(vulkan_vortek PRIVATE
              ANDROID
              VK_USE_PLATFORM_ANDROID_KHR
          )

          set(CMAKE_C_FLAGS "${CMAKE_C_FLAGS} -O2 -Wall -Wno-ignored-qualifiers -fexceptions -fPIC")

          target_link_libraries(vulkan_vortek
              android
              log
              vulkan
          )
          EOF

      # 4. Environment Setup
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Configure NDK
        shell: bash
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/24.0.8215888"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      # 5. Build
      - name: Build Winlator
        working-directory: app
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      # 6. Artifacts
      - name: Upload Winlator APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Ultimate-ARM64
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
